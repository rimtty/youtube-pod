name: iOS CI

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Xcode 27 tests
    runs-on: xcode-27
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version
          python3 --version

      - name: Bootstrap pinned dependencies
        run: ./scripts/bootstrap.sh

      - name: Run simulator tests
        run: ./scripts/verify.sh

      - name: Run Apple Watch Series 9+ simulator tests
        run: ./scripts/verify_watch.sh

      - name: Run static analysis
        run: |
          xcodebuild analyze \
            -project YouTubePod.xcodeproj \
            -scheme YouTubePod \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath /tmp/youtubepod-analyze-derived-data
